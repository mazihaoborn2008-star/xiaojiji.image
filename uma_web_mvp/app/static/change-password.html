<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>修改登录密码 - 小击击生图</title>
  <link rel="icon" href="/assets/branding/favicon.ico?v=mizuhara">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/branding/favicon-32x32.png?v=mizuhara">
  <link rel="apple-touch-icon" href="/assets/branding/apple-touch-icon.png?v=mizuhara">
  <link rel="stylesheet" href="/assets/styles.css?v=private-support-messages1">
  <link rel="stylesheet" href="/assets/theme-soft-white-pink.css?v=soft-white-pink-v1">
</head>
<body class="sub-page">
  <header class="topbar sub-page-topbar">
    <button class="ghost back-btn" type="button" data-back-home data-i18n="nav.back">返回</button>
    <div class="sub-page-title">
      <span data-i18n="settings.change_password">修改登录密码</span>
    </div>
    <div class="sub-page-actions">
      <span id="userName" class="sub-page-user"></span>
      <span id="balance" class="sub-page-balance"></span>
    </div>
    <div class="nav-menu-wrap">
      <button id="menuBtn" class="ghost menu-button" type="button" aria-expanded="false" aria-controls="navMenu">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <span data-i18n="nav.menu">菜单</span>
      </button>
      <nav id="navMenu" class="nav-menu hidden" role="menu" aria-label="Main menu">
        <a href="/smart-agent" role="menuitem" data-i18n="nav.smart_agent">智能 Agent</a>
        <a href="/messages" role="menuitem" data-i18n="nav.messages">消息中心</a>
        <a href="/topup" role="menuitem" data-i18n="nav.topup">充值</a>
        <a href="/character-tags" role="menuitem" data-i18n="nav.character_tags">人物 Tag</a>
        <a href="/feedback" role="menuitem" data-i18n="nav.feedback">用户反馈</a>
        <a href="/change-password" role="menuitem" data-i18n="nav.change_password">修改密码</a>
        <a href="/settings" role="menuitem" data-i18n="nav.settings">设置/帮助</a>
      </nav>
    </div>
  </header>

  <main class="layout-single">
    <section class="panel form-panel">
      <h1 data-i18n="settings.change_password">修改登录密码</h1>
      <section id="passwordPanel" class="stack">
        <p id="passwordHint" class="muted" data-i18n="settings.set_hint">已验证邮箱。设置密码后，下次可直接使用邮箱和密码登录。</p>
        <label id="oldPasswordWrap" class="hidden"><span data-i18n="settings.old_password">当前密码</span>
          <input id="oldPassword" type="password" autocomplete="current-password" maxlength="128">
        </label>
        <label><span data-i18n="settings.new_password">新密码</span>
          <input id="newPassword" type="password" autocomplete="new-password" maxlength="128">
        </label>
        <label><span data-i18n="settings.confirm_password">确认新密码</span>
          <input id="confirmPassword" type="password" autocomplete="new-password" maxlength="128">
        </label>
        <label class="check">
          <input id="revokeOtherSessions" type="checkbox">
          <span data-i18n="settings.revoke_other">保存后退出其他设备</span>
        </label>
        <button id="passwordSaveBtn" class="primary" type="button" data-i18n="settings.set_password">保存登录密码</button>
        <div id="passwordMessage" class="message"></div>
      </section>
      <div id="notEmailMessage" class="message hidden">
        <p data-i18n="settings.password_email_only">修改密码功能仅支持邮箱登录账户。</p>
      </div>
    </section>
  </main>

  <script src="/assets/i18n.js?v=private-support-messages1" defer></script>
  <script src="/assets/change-password.js?v=private-support-messages1" defer></script>
</body>
</html>
