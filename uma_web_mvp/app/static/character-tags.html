<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

<body class="sub-page">

    <div class="sub-page-title">
      <span data-i18n="tags.page_title">人物 Tag</span>
    </div>
    <div class="sub-page-actions">
      <span id="userName" class="sub-page-user"></span>
      <span id="balance" class="sub-page-balance"></span>
    </div>
    <div class="nav-menu-wrap">
      <button id="menuBtn" class="ghost menu-button" type="button" aria-expanded="false" aria-controls="navMenu">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <span data-i18n="nav.menu">菜单</span>
      </button>
      <nav id="navMenu" class="nav-menu hidden" role="menu" aria-label="Main menu">
        <a href="/smart-agent" role="menuitem" data-i18n="nav.smart_agent">智能 Agent</a>
        <a href="/messages" role="menuitem" data-i18n="nav.messages">消息中心</a>

  </header>

  <main class="layout-single">
    <section class="panel form-panel">
      <h1 data-i18n="tags.title">常用人物 tag</h1>

      <form id="tagSearchForm" class="tag-search-row" autocomplete="off">
        <input id="tagSearch" class="tag-search" type="search" autocomplete="off" placeholder="搜索角色名或作品名" data-i18n-placeholder="tags.search_placeholder">
        <button id="tagSearchBtn" class="primary" type="submit" data-i18n="tags.search_button">搜索</button>
      </form>
      <div id="tagCategories" class="tag-categories" aria-label="tag categories"></div>
      <div id="tagStatus" class="message"></div>
      <div id="tagList" class="tag-list"></div>
    </section>
  </main>

  <script src="/assets/i18n.js?v=character-tags-bundle-merge1" defer></script>
